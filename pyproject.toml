[project]
name = "ds-population-mirror"
version = "0.1.0"
description = "Canonical admin-level total-population baseline (HDX HAPI / UNFPA COD-PS)"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "python-dotenv",
    "ocha-stratus>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
